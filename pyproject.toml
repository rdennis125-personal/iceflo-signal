[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iceflo-signal"
version = "0.1.0"
description = "Operational reporting and notification platform scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "jinja2>=3.1,<4",
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-storage>=2.18,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
