name: Deploy Cloud Run Job

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  CLOUD_RUN_JOB: ${{ vars.CLOUD_RUN_JOB }}
  CLOUD_RUN_JOBS: ${{ vars.CLOUD_RUN_JOBS }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/iceflo-signal:${GITHUB_SHA}"
          docker build --tag "${IMAGE}" .
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Push image
        run: docker push "${IMAGE}"

      - name: Deploy Cloud Run job image
        run: |
          JOBS="${CLOUD_RUN_JOBS:-$CLOUD_RUN_JOB}"
          IFS=',' read -ra JOB_NAMES <<< "${JOBS}"
          for JOB_NAME in "${JOB_NAMES[@]}"; do
            JOB_NAME="$(echo "${JOB_NAME}" | xargs)"
            if [ -z "${JOB_NAME}" ]; then
              continue
            fi
            gcloud run jobs update "${JOB_NAME}" \
              --image "${IMAGE}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}"
          done
